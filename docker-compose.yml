version: '3.8'

services:
  etrai-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: etrai-verification-engine
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=${JWT_SECRET:-etrai_production_secret_key_minimum_32_characters_long}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:5000}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-flash-lite-latest}
      - SERPER_API_KEY=${SERPER_API_KEY}
    volumes:
      - etrai-data:/app/backend/prisma
      - etrai-backups:/app/backend/backups
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/v1/health/ready').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  etrai-data:
  etrai-backups:
